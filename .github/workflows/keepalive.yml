name: Keepalive

# GitHubは60日間リポジトリに活動がないと、スケジュール実行のワークフローを自動で無効化する。
# 最終コミットから30日以上経っていたら空コミットを積み、無効化を防ぐ。

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Push an empty commit if the repo has been quiet for 30+ days
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_days=$(( (now - last) / 86400 ))
          echo "Last commit is ${age_days} days old"
          if [ "$age_days" -ge 30 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive to prevent scheduled workflow auto-disable"
            git push
          fi

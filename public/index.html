<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#f7f8f5"><title>Tech Feed</title><style>
:root{--paper:#f7f8f5;--ink:#17211d;--muted:#68726c;--line:#dce1dc;--green:#16795b;--pale:#dff4e9;--shadow:0 12px 32px rgba(18,38,28,.06)}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:linear-gradient(155deg,#e8f3ed,#f7f8f5 30rem);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}main{width:min(1160px,calc(100% - 40px));margin:auto;padding:26px 0 64px}.masthead{display:flex;justify-content:space-between;align-items:center;padding-bottom:58px;color:var(--muted);font-size:.78rem;font-weight:750;letter-spacing:.08em;text-transform:uppercase}.brand{color:var(--green);display:flex;gap:9px;align-items:center}.mark{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;color:#fff;background:var(--green)}.hero{margin-bottom:31px}.eyebrow{margin:0 0 11px;color:var(--green);font-size:.75rem;font-weight:800;letter-spacing:.15em}h1{margin:0;font-family:ui-serif,Georgia,"Hiragino Mincho ProN",serif;font-size:clamp(1.65rem,2.8vw,2.4rem);letter-spacing:-.035em;line-height:1.15}.subtitle{max-width:36rem;margin:17px 0 0;color:var(--muted);line-height:1.75}.panel{background:rgba(255,255,255,.82);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.filters{display:grid;grid-template-columns:1.7fr repeat(2,1fr);gap:9px;padding:12px;margin-bottom:16px}input,select{width:100%;min-height:45px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#fbfcfa;color:var(--ink);font:inherit;font-size:.9rem;outline:none}input:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(22,121,91,.12)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:26px}.stat{padding:14px 17px;border-left:3px solid var(--green)}.stat:nth-child(2){border-left-color:#386ba8}.stat:nth-child(3){border-left-color:#c88125}.stat strong{display:block;font-size:1.45rem}.stat span{color:var(--muted);font-size:.79rem}.heading{display:flex;justify-content:space-between;margin:0 3px 12px}.heading h2{margin:0;font-size:1rem}.heading span{color:var(--muted);font-size:.82rem}.articles{display:grid;gap:9px}.article{display:grid;grid-template-columns:12px 1fr;gap:15px;padding:18px;background:rgba(255,255,255,.91);border:1px solid var(--line);border-radius:15px;box-shadow:0 3px 9px rgba(18,38,28,.025);transition:.16s}.article:hover{transform:translateY(-2px);border-color:#bcd2c6;box-shadow:var(--shadow)}.dot{width:8px;height:8px;margin-top:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px var(--pale)}h3{margin:0 0 8px;font-size:1rem;line-height:1.5}a{color:var(--ink);text-decoration:none}a:hover{color:var(--green)}.meta{color:var(--muted);font-size:.79rem}.empty{padding:42px;text-align:center;color:var(--muted);border:1px dashed #c9d4cc;border-radius:16px}.source-list{margin:27px 4px 0;color:var(--muted);font-size:.78rem}.source-list:before{content:'●';color:var(--green);margin-right:7px}@media(max-width:650px){main{width:min(100% - 26px,1160px)}.masthead{padding-bottom:40px}.filters{grid-template-columns:1fr}.summary{grid-template-columns:1fr}}
</style></head><body><main><header class="masthead"><div class="brand"><span class="mark">◆</span>Tech Feed</div><div id="updated">更新情報を読み込み中</div></header><section class="hero"><p class="eyebrow">PERSONAL READING DESK</p><h1>読むべき技術情報を、<br>ひとつの場所に。</h1><p class="subtitle">公開された技術情報を定期的に収集し、読みたいテーマへすばやく絞り込みます。</p></section><section class="filters panel"><input id="search" type="search" placeholder="タイトル・要約を検索"><select id="category"><option value="all">すべてのカテゴリ</option><option>Speaker Deck</option><option>はてなブックマーク IT</option><option>AWS</option><option>Azure</option><option>Claude</option><option>ChatGPT</option><option>Kubernetes</option><option>Docker</option></select><select id="period"><option value="all">全期間</option><option value="today">過去24時間</option><option value="week">過去7日</option></select></section><section class="summary"><div class="stat panel"><strong id="count">–</strong><span id="count-label">表示中の記事</span></div><div class="stat panel"><strong id="total">–</strong><span>全収集記事数</span></div><div class="stat panel"><strong>30分</strong><span>更新間隔の目安</span></div></section><div class="heading"><h2>記事一覧</h2><span id="note">読み込み中</span></div><section class="articles" id="articles"><div class="empty">記事を読み込み中です…</div></section><footer class="source-list" id="sources"></footer></main><script>
const $=s=>document.querySelector(s),escape=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data={articles:[],sources:[]};const displayDate=v=>v?new Intl.DateTimeFormat('ja-JP',{month:'short',day:'numeric'}).format(new Date(v)):'';function render(){const q=$('#search').value.toLowerCase(),category=$('#category').value,period=$('#period').value,cut=period==='today'?Date.now()-864e5:period==='week'?Date.now()-6048e5:0,items=data.articles.filter(a=>(category==='all'||a.category===category)&&(!q||`${a.title} ${a.summary}`.toLowerCase().includes(q))&&(!cut||new Date(a.published_at).getTime()>=cut));const periodLabel={all:'全期間',today:'過去24時間',week:'過去7日'}[period];$('#count').textContent=items.length;$('#count-label').textContent=`${periodLabel}の表示記事`;$('#note').textContent=`${items.length} 件（${periodLabel}）`;$('#articles').innerHTML=items.length?items.map(a=>`<article class="article"><span class="dot"></span><div><h3><a href="${escape(a.url)}" target="_blank" rel="noopener">${escape(a.title)}</a></h3><div class="meta">${escape(a.category)}　/　${escape(a.source)}${displayDate(a.published_at)?'　·　'+displayDate(a.published_at):''}</div></div></article>`).join(''):'<div class="empty">該当する記事はありません。</div>'}async function init(){try{data=await fetch('./articles.json').then(r=>r.ok?r.json():Promise.reject());$('#total').textContent=data.articles.length;$('#updated').textContent=`最終更新 ${new Intl.DateTimeFormat('ja-JP',{dateStyle:'medium',timeStyle:'short'}).format(new Date(data.updated_at))}`;$('#sources').textContent='収集元　'+data.sources.map(s=>s.name).join('　/　');render()}catch{$('#articles').innerHTML='<div class="empty">記事データの準備中です。</div>'}}$('#search').oninput=render;$('#category').onchange=render;$('#period').onchange=render;init();
</script></body></html>
